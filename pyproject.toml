[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbm-esports"
version = "0.1.0"
description = "MBM Esports CS2 vertical slice (Maps 1–2 Headshots)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MBM" }]
dependencies = [
  "mbm-core @ file:vendor/mbm-core/mbm_core-0.1.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mbm*"]

[tool.ruff]
line-length = 100
target-version = "py311"
